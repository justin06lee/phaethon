<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600">
  <defs>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b04c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2b04c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fb4ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="700" height="600" rx="28" fill="#0b0c10"/>

  <!-- the proxy: a sun that drives, outside and above -->
  <circle cx="200" cy="150" r="110" fill="url(#sun)"/>
  <circle cx="200" cy="150" r="46" fill="#f2b04c"/>
  <circle cx="200" cy="150" r="46" fill="none" stroke="#ffd48a" stroke-width="4"/>
  <g stroke="#f2b04c" stroke-width="6" stroke-linecap="round">
    <line x1="200" y1="76" x2="200" y2="58"/>
    <line x1="200" y1="224" x2="200" y2="242"/>
    <line x1="126" y1="150" x2="108" y2="150"/>
    <line x1="274" y1="150" x2="292" y2="150"/>
    <line x1="148" y1="98" x2="135" y2="85"/>
    <line x1="252" y1="202" x2="265" y2="215"/>
    <line x1="148" y1="202" x2="135" y2="215"/>
    <line x1="252" y1="98" x2="265" y2="85"/>
  </g>

  <!-- the route it plots, down into the hollow -->
  <path d="M244 186 C 330 250, 330 300, 420 318" fill="none" stroke="#f2b04c" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/>
  <circle cx="300" cy="244" r="7" fill="#0b0c10" stroke="#f2b04c" stroke-width="3"/>
  <circle cx="352" cy="294" r="7" fill="#0b0c10" stroke="#f2b04c" stroke-width="3"/>

  <!-- the hollow -->
  <circle cx="470" cy="338" r="120" fill="none" stroke="#1d2030" stroke-width="3" stroke-dasharray="18 30 70 22 8 26" stroke-linecap="round"/>
  <circle cx="470" cy="338" r="104" fill="#05060a"/>
  <circle cx="470" cy="338" r="104" fill="none" stroke="#3a3f52" stroke-width="7"/>
  <circle cx="470" cy="338" r="88" fill="url(#glow)"/>
  <circle cx="420" cy="318" r="9" fill="#8fb4ff"/>

  <text x="350" y="540" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" fill="#e9eaf0" letter-spacing="6">phaethon</text>
</svg>
